<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- tag button -->
    <button class="button__tag"><span class="blind">내용</span>내용</button>
    <button class="button__tag" button-style="ghost"><span class="blind">내용</span>내용</button>
    <button class="button__tag" button-size="large"><span class="blind">내용</span>내용</button>
    <button class="button__tag" button-size="large" show-marker="false"><span class="blind">내용</span>내용</button>
    <button class="button__tag" button-size="large" show-marker="false" button-selected="true"><span class="blind">내용</span>내용</button>

    <!-- buttons-st-1 -->
    <a href="#" class="button__st-1" title="전체보기"><span class="button__st-1-text">전체보기</span></a>
    <a href="#" class="button__st-1" button-style="inverted" title="전체보기"><span class="button__st-1-text">전체보기</span></a>
    <a href="#" class="button__st-1" button-style="ghost" title="전체보기"><span class="button__st-1-text">전체보기</span></a>

    <!-- card-st-1 -->
    <div class="slide__content slide__content-middle card-st-1">
      <div class="left-box">
        <div class="img-box"><img src="./images/img_knee.webp" alt="Furuto knee protective gear" /></div>
      </div>
      <div class="right-box">
        <div class="slide__content-tag-wrap tag-wrap">
          <button class="button__tag"><span class="blind">상처케어</span>상처케어</button>
          <button class="button__tag"><span class="blind">보호대</span>보호대</button>
          <button class="button__tag"><span class="blind">Furuto</span>Furuto</button>

        <div class="slide__content-review card__review">
          <div class="review__star img-box"><img src="./images/ico_star.svg" alt="" /></div>
          <span class="reivew__star-digit">4.9</span>
          <span class="review">리뷰</span>
          <span class="review__amount">583</span>
        </div>

            </i>
          </a>
        </div>
      </div>
    </div>

    <!-- card-st-2 -->
    <div class="slide__content card-st-2">
      <div class="img-box"><img src="./images/img_653-2.webp" alt="" /></div>
      <div class="text-box">
        <div class="card__name">3M 스카치브라이트 옥수수 그물 망사 수세미 10개 (5입x2개) 주방용</div>
        <div class="card__price">27,000<span class="price__unit">원</span></div>
        <div class="card__review">
          <div class="review__star img-box"><img src="./images/ico_star.svg" alt="" /></div>
          <span class="reivew__star-digit">4.9</span>
          <span class="review">리뷰</span>
          <span class="review__amount">877</span>
        </div>
      </div>
    </div>

    <!-- card-st-3 -->
    <div class="card-st-3">
      <div class="card__img img-box">
        <img src="./images/img_news-1.webp" alt="" />
        <div class="img__filter"></div>
      </div>
      <div class="card__text">
        <div class="card__tag">태그</div>
        <div class="card__title">타이틀</div>
        <div class="card__date">날짜</div>
      </div>
    </div>

    <!-- swiper-btns -->
    <div class="swiper-btns">
      <div class="swiper-btns__prev" button-style="ghost">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15.975 22L17.75 20.225L9.525 12L17.75 3.775L15.975 2L5.975 12L15.975 22Z" fill="currentColor" />
        </svg>
      </div>
      <div class="swiper-btns__next" button-style="ghost">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8.025 22L6.25 20.225L14.475 12L6.25 3.775L8.025 2L18.025 12L8.025 22Z" fill="currentColor" />
        </svg>
      </div>
    </div>
